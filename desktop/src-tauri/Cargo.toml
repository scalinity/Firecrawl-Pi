[package]
name = "firecrawl-pi"
version = "0.1.0"
description = "Local Firecrawl Pi playground"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
serde_json = "=1.0.145"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWindow", "NSButton", "NSControl", "NSView"] }
rfd = { version = "=0.16.0", default-features = false }
