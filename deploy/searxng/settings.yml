# FCPI's private SearXNG (FIRECRAWL_PI_SPEC.md §13): JSON output only, a small engine set, no limiter, no
# public UI, one application worker. deploy/searxng/entrypoint.sh copies this file to the container's
# tmpfs and appends the outgoing section, which carries the search proxy's credential; the server's
# secret key comes from SEARXNG_SECRET. Every engine request leaves through the retrieval service's search
# proxy, the container's only route: while the host's selection is "fixture" that proxy lets only the
# fixture engine through, and while it is "live" only the live engines' hosts (deploy/policies/egress.json).
use_default_settings:
  engines:
    # The engines the policy can name (search.engines.live is the subset queried), kept from SearXNG's
    # defaults; the fixture engines are defined below. Brave and DuckDuckGo refuse the home connection and
    # are routed residential, so they are queried only once the residential route is approved. Bing's HTML
    # answer for a multi-term query is generic popular sites (code.org for "code review benchmark ..."),
    # so it is not kept. Mojeek and Startpage answer the home connection with a JavaScript and a
    # proof-of-work captcha, and this SearXNG leaves both inactive (never loaded), so they are not kept.
    keep_only:
      - yahoo
      # Loaded but not queried automatically: the residential test returned access denied.
      - google
      - duckduckgo
      - brave

general:
  instance_name: "fcpi"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  # An engine that fails is suspended briefly rather than for SearXNG's default hours, so a transient
  # block does not hide the engine through a whole acceptance window.
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 300
    cf_SearxEngineCaptcha: 600
    cf_SearxEngineAccessDenied: 300
    recaptcha_SearxEngineCaptcha: 600
  # JSON only: the retrieval service is the one client, and no HTML page is served.
  formats:
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: false
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

valkey:
  url: false

plugins:
  # The tracker-URL remover fetches ClearURLs rule lists from the Internet at start; nothing here needs it,
  # and the container has no route for it (it failed closed when first started: evidence/M5/INTERPRETATION.md).
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: false

engines:
  - name: google
    disabled: false
  # The controlled engine (tests/fixtures/m5/providers.mjs searchHandler), reached through the search
  # proxy like every other engine, for the fixture phase's results, empty answers and failures.
  - name: fcpi fixture
    engine: json_engine
    shortcut: fcpif
    categories: [general]
    search_url: http://search.fixture.fcpi.test:8080/search?q={query}
    results_query: results
    url_query: url
    title_query: title
    content_query: content
    timeout: 3.0
    disabled: false
    # The fixture is served over plain http on the internal fixture network. Plain http stays off for every
    # other engine (SearXNG's outgoing.enable_http default): curl then speaks https alone.
    enable_http: true
  # The second controlled engine, which also fails on "fcpi-partial": with it, one query shows a partial answer.
  - name: fcpi fixture b
    engine: json_engine
    shortcut: fcpifb
    categories: [general]
    search_url: http://search.fixture.fcpi.test:8080/search-b?q={query}
    results_query: results
    url_query: url
    title_query: title
    content_query: content
    timeout: 3.0
    disabled: false
    enable_http: true
  # M6 (F11): the controlled engine the policy routes residential (search.engineRoutes), as Brave and DuckDuckGo are:
  # the search proxy sends it only through the residential proxy and refuses it when that route is unavailable.
  - name: fcpi fixture r
    engine: json_engine
    shortcut: fcpifr
    categories: [general]
    search_url: http://searchr.fixture.fcpi.test:8080/search?q={query}
    results_query: results
    url_query: url
    title_query: title
    content_query: content
    timeout: 5.0
    disabled: false
    enable_http: true
