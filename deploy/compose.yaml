# FCPI curated Compose (M1: durable, private core; M2: guarded retrieval and a sandboxed browser;
# M3: the authorized REST gateway with its durable job ledger; M4: the stateless MCP service behind it;
# M5: private SearXNG, and the search, model and parser adapters in the retrieval service; M6: the residential route;
# M7: the enhanced provider, the browser extras and webhook delivery in the retrieval service).
# Start and stop through systemd (fcpi-stack.service). The fail-closed data check
# (deploy/host/fcpi-data-check.sh) runs before every start of the stack and, through a
# docker.service drop-in, before every dockerd start, which is when restart policies
# revive containers after an unclean shutdown.
# Every image is pinned by its linux/arm64 manifest digest; the NuQ image is built on
# the Pi from deploy/nuq-postgres and referenced by its built digest.
# Host publication: the access gateway on 127.0.0.1:3380 only. Networks: fcpi_access
# (publication; gateway only), fcpi_api (gateway <-> core), fcpi_platform (gateway <-> PostgreSQL),
# fcpi_core (core, data services and the retrieval service), fcpi_acquire (core <-> retrieval service),
# fcpi_browser (retrieval service <-> browser worker), fcpi_fixture (retrieval service and the
# fixtures), fcpi_mcp (gateway <-> MCP service; M4), fcpi_search (retrieval service <-> SearXNG; M5),
# fcpi_model (gateway <-> the retrieval service's extraction listener; M5), all internal and isolated;
# and fcpi_egress (the retrieval service alone), the only way out, guarded by fcpi_guard.
# The core has no route out: every acquisition goes through the retrieval service (M2).
# Every bind mount sets create_host_path: false, so a missing data path fails the
# start instead of being recreated on the root card.
# M8: every container runs under fcpi.slice, whose MemorySwapMax=0 systemd re-asserts at each reload (a reload lifts the
# per-container swap limit Docker writes, M4 review F2); the gateway and the retrieval service read the host's admission
# file (/run/firecrawl-pi/admission, written by the host tick, scripts/ops/tick.sh).
name: fcpi

x-logging-app: &logging-app
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
x-logging-dep: &logging-dep
  driver: json-file
  options: { max-size: "5m", max-file: "2" }

services:
  nuq-postgres:
    image: fcpi/nuq-postgres@sha256:ef257b914120c04cc7250d6120123c42e7fae75ce314e2a67a37f3a31de4c180
    platform: linux/arm64
    pull_policy: never
    hostname: nuq-postgres
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "5432:5432"                  # dedicated uid; the image default (999) is pihole on this host
    # Command-line settings outrank nuq.sql's ALTER SYSTEM values in postgresql.auto.conf:
    # WAL sizing for the 64 GB card, spec §22 memory/connection limits, durability kept on.
    # M8 (M1 review R15): nuq.sql's server-class background and WAL writer settings return to PostgreSQL's defaults on the
    # microSD card, measured against them on the same paced workload (evidence/M8/raw/pg-writes.txt, verifier S03).
    command:
      - postgres
      - -c
      - bgwriter_delay=200ms
      - -c
      - bgwriter_lru_maxpages=100
      - -c
      - bgwriter_lru_multiplier=2.0
      - -c
      - wal_writer_delay=200ms
      - -c
      - wal_buffers=-1
      - -c
      - effective_io_concurrency=1
      - -c
      - maintenance_io_concurrency=10
      - -c
      - commit_delay=0
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=32
      - -c
      - max_wal_size=1GB
      - -c
      - min_wal_size=80MB
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - synchronous_commit=on
    environment:
      POSTGRES_DB: postgres          # pg_cron can only be created in cron.database_name
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # postgres_core_role_password: the core's own role, created at initdb by
    # 020-fcpi-core-role.sh (the image's entrypoint ignores the .psql file it reads).
    secrets: [postgres_password, postgres_core_role_password, postgres_retrieval_role_password, postgres_gateway_role_password]
    volumes:
      - type: bind
        source: /srv/firecrawl-pi/data/postgres
        target: /var/lib/postgresql/data
        bind: { create_host_path: false }
      - type: bind
        source: /opt/firecrawl-pi/deploy/nuq-postgres/initdb/020-fcpi-core-role.sh
        target: /docker-entrypoint-initdb.d/020-fcpi-core-role.sh
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /opt/firecrawl-pi/deploy/nuq-postgres/fcpi-core-role.psql
        target: /docker-entrypoint-initdb.d/fcpi-core-role.psql
        read_only: true
        bind: { create_host_path: false }
      # M2: the retrieval service's schema and role (DML only), for a new data directory;
      # scripts/m2/pi-retrieval-db.sh applies the same file to an existing one.
      - type: bind
        source: /opt/firecrawl-pi/deploy/nuq-postgres/initdb/030-fcpi-retrieval.sh
        target: /docker-entrypoint-initdb.d/030-fcpi-retrieval.sh
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /opt/firecrawl-pi/deploy/nuq-postgres/fcpi-retrieval-schema.sql
        target: /docker-entrypoint-initdb.d/fcpi-retrieval-schema.psql
        read_only: true
        bind: { create_host_path: false }
      # M3: the platform ledger's schema and the gateway's role (DML only), for a new data
      # directory; scripts/m3/pi-platform-db.sh applies the same file to an existing one.
      - type: bind
        source: /opt/firecrawl-pi/deploy/nuq-postgres/initdb/040-fcpi-platform.sh
        target: /docker-entrypoint-initdb.d/040-fcpi-platform.sh
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /opt/firecrawl-pi/deploy/nuq-postgres/fcpi-platform-schema.sql
        target: /docker-entrypoint-initdb.d/fcpi-platform-schema.psql
        read_only: true
        bind: { create_host_path: false }
    tmpfs:
      - /var/run/postgresql:mode=1777,size=4m
      - /tmp:size=64m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 640m
    memswap_limit: 640m
    cpus: 0.75
    pids_limit: 128
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # fcpi_platform (M3) holds only the gateway beside it.
    networks: [core, platform]
    logging: *logging-dep

  redis:
    image: redis@sha256:41a10b18bd238fa7837b1615b2b5b113edff1654233238ac82d87e6fb5531f44
    platform: linux/arm64
    pull_policy: missing
    hostname: redis
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "6379:6379"                  # dedicated uid; the image default (999) is pihole on this host
    entrypoint: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    secrets: [redis_users_acl]
    volumes:
      - type: bind
        source: /srv/firecrawl-pi/data/redis
        target: /data
        bind: { create_host_path: false }
      - type: bind
        source: /opt/firecrawl-pi/deploy/redis/redis.conf
        target: /usr/local/etc/redis/redis.conf
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.35
    pids_limit: 64
    stop_grace_period: 30s
    healthcheck:
      # The 'health' ACL user may only PING, and needs no password.
      test: ["CMD", "redis-cli", "--no-auth-warning", "--user", "health", "--pass", "-", "PING"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [core]
    logging: *logging-dep

  rabbitmq:
    image: rabbitmq@sha256:1a4b64d98915c38f496d1047f427baecdf0f5f73a773c8f2f7a515ce9763b5f8
    platform: linux/arm64
    pull_policy: missing
    # A fixed hostname keeps the node name rabbit@rabbitmq, and with it the data
    # directory, stable across container recreation.
    hostname: rabbitmq
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "5672:5672"                  # dedicated uid; the image default (999) is pihole on this host
    environment:
      RABBITMQ_NODENAME: rabbit@rabbitmq
    # The 4.x entrypoint rejects RABBITMQ_DEFAULT_PASS_FILE, and the plain variable would
    # show in docker inspect, so the first-boot user comes from a 0600 conf fragment.
    secrets:
      - source: rabbitmq_default_user_conf
        target: /etc/rabbitmq/conf.d/40-fcpi-default-user.conf
    volumes:
      - type: bind
        source: /srv/firecrawl-pi/data/rabbitmq
        target: /var/lib/rabbitmq
        bind: { create_host_path: false }
      - type: bind
        source: /opt/firecrawl-pi/deploy/rabbitmq/30-fcpi.conf
        target: /etc/rabbitmq/conf.d/30-fcpi.conf
        read_only: true
        bind: { create_host_path: false }
    tmpfs:
      - /tmp:size=16m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 256
    stop_grace_period: 60s
    healthcheck:
      # A TCP connect to 5672: ~5 MiB inside the cap, where `rabbitmq-diagnostics ping`
      # starts an Erlang VM of ~77 MiB (evidence/M1/raw/native-proofs.txt). Deeper
      # checks (check_running, check_local_alarms, rabbitmq_prometheus) run on demand.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    networks: [core]
    logging: *logging-dep

  firecrawl-core:
    # The project build: upstream 7666c1f9 plus patches/ (patches/series.json), built for
    # linux/arm64 by scripts/m2/build-api-image.sh and loaded by digest (review Q7, D6).
    image: fcpi/firecrawl-api@sha256:c2585732a072873583fc36c5d16a4c945bb6eee8c0252e0b05da54a2ed886a5c
    platform: linux/arm64
    pull_policy: never
    hostname: firecrawl-core
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    entrypoint: ["/fcpi/entrypoint.sh"]
    command: ["node", "dist/src/harness.js", "--start-docker"]
    environment:
      HOST: 0.0.0.0
      PORT: "3002"
      NUQ_WORKER_COUNT: "1"             # the harness defaults to 5 (config.ts:231)
      USE_DB_AUTHENTICATION: "false"    # private core behind the authenticated gateway
      POSTGRES_HOST: nuq-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: fcpi_core          # DML on NuQ's tables only; not a superuser (deploy/nuq-postgres/fcpi-core-role.psql)
      POSTGRES_DB: postgres
      SCRAPE_MAX_ATTEMPTS: "1"          # spec §29; the retrieval service owns retries
      # The pi-resilient profile (patches/0003): every acquisition goes to the retrieval service,
      # whose credential the entrypoint loads from core_retrieval_token. ALLOW_LOCAL_WEBHOOKS is
      # unset: the private fixture is reached only through the service's fixture allowlist
      # (review finding R4), and config.ts refuses the profile if the flag is set.
      PI_RETRIEVAL_URL: http://retrieval-service:3310
      # Search asks the service's SearXNG-compatible route, which asks the private SearXNG (M5);
      # patches/0005 removes the direct DuckDuckGo fallback and 0007 types every search failure.
      # No OPENAI_*, MODEL_* or parser variable: no native model path is enabled (spec §14).
      SEARXNG_ENDPOINT: http://retrieval-service:3310/searxng
      DISABLE_WEBHOOK_DELIVERY: "true"
      # Each child's V8 heap ceiling, inside the container's unchanged memory cap (spec §22). Measured in M7: the API child
      # holds 232 MiB live at rest, so 256 left about 24 MiB for a request and a scrape answer with a few MiB of captures
      # exhausted it; 384 gives each child room while the cap still bounds them together.
      NODE_OPTIONS: --max-old-space-size=384
      # Deliberately unset: USE_GO_MARKDOWN_PARSER (the Go library stays inert),
      # BULL_AUTH_KEY (queue admin disabled), every Cloud key.
    secrets: [core_postgres_password, core_redis_url, core_nuq_rabbitmq_url, core_retrieval_token]
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/deploy/firecrawl-core/entrypoint.sh
        target: /fcpi/entrypoint.sh
        read_only: true
        bind: { create_host_path: false }
    tmpfs:
      - /tmp:size=256m
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID]           # used once, by setpriv, to drop to uid 3002
    security_opt: [no-new-privileges:true]
    # Measured in M7 with 384 MiB heaps under the full evidence run: about 2.21 GB at peak (spec §22).
    mem_limit: 2560m
    memswap_limit: 2560m
    cpus: 2.25
    pids_limit: 512
    stop_grace_period: 45s
    healthcheck:
      # Beyond the API heartbeat: nuq-worker-0's /health runs a PostgreSQL query. It runs as
      # the service uid (3002), not the container's root, like every resident process. M8: it prints each part's result
      # ("api=ok worker=fail"), which Docker keeps with the check's time: the worker's heartbeat, and a live API with a
      # dead worker shown as the degraded state it is (spec §24.1; fcpi status).
      test: ["CMD", "setpriv", "--reuid=3002", "--regid=3002", "--clear-groups", "node", "-e", "Promise.all(['http://127.0.0.1:3002/v0/health/liveness','http://127.0.0.1:3006/health'].map(u=>fetch(u,{signal:AbortSignal.timeout(5000)}).then(r=>r.ok,()=>false))).then(([a,w])=>{console.log('api='+(a?'ok':'fail')+' worker='+(w?'ok':'fail'));process.exit(a&&w?0:1)})"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s
    depends_on:
      nuq-postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      retrieval-service: { condition: service_healthy }
    # Not on fcpi_fixture since M2: the fixture is reached only through the retrieval service.
    networks: [core, api, acquire]
    logging: *logging-app

  # M3: the authenticated REST boundary and job ledger (services/access), built on the Pi from the
  # deployed commit (scripts/m3/pi-build-gateway.sh) on the digest-pinned node base. Targets are no
  # longer limited to fixtures here: every acquisition passes the retrieval service's policy (M2).
  access-gateway:
    image: fcpi/access-gateway@sha256:6b9c1ae62837b76d3433d7c764f7133b8033552925f4d437d39109e6a8623f6f
    platform: linux/arm64
    pull_policy: never
    hostname: access-gateway
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "3380:3380"
    environment:
      PI_GATEWAY_LISTEN_PORT: "3300"
      PI_CORE_URL: http://firecrawl-core:3002
      PI_CORE_TIMEOUT_MS: "110000"      # spec §9.3: the 90 s acquisition inside a 110 s gateway deadline
      PI_MODEL_EXTRACT_EXTRA_MS: "300000" # a json request that names its model (the Agent's) may wait this much longer on it (spec §14)
      PI_GATEWAY_CLIENTS_FILE: /srv/clients/clients
      # The origins the gateway is served at: its loopback publication, as the host and an SSH
      # forward to it present it; and, from the host-side file scripts/m3/pi-tailscale.sh writes,
      # the Tailscale Serve origin, whose tailnet name stays out of the repository.
      PI_ALLOWED_HOSTS: http://127.0.0.1:3380,http://localhost:3380
      PI_ALLOWED_HOSTS_FILE: /srv/clients/served-origins
      PI_ALLOWED_ORIGINS: ""
      PI_CAPABILITIES_FILE: /srv/policy/capabilities.json
      PI_ARTIFACT_ROOT: /srv/artifacts
      PI_CREDENTIALS_DIR: /run/secrets
      PI_POSTGRES_HOST: nuq-postgres
      PI_POSTGRES_DB: postgres
      PI_POSTGRES_USER: fcpi_gateway
      PI_CLOUD_ACCESS_ENABLED: "false"
      PI_MCP_URL: http://10.231.8.20:3400
      # M5: the retrieval service's extraction listener on fcpi_model, for the json format and /v2/extract.
      PI_EXTRACT_URL: http://10.231.9.20:3314
      # M8: the host's admission state; new work is refused 503 HOST_PRESSURE while dispatch is paused (spec §23.1).
      PI_ADMISSION_FILE: /srv/admission/admission.json
      PI_INCIDENT_GRANTS_DIR: /srv/incidents/grants
      PI_INCIDENT_REQUESTS_DIR: /srv/incidents/requests
      PI_INCIDENT_KEY_FILE: /srv/incidents/public-key.pem
      PI_INCIDENT_REPORTS_DIR: /srv/incidents/reports
      PI_INCIDENT_OWNER_FILE: /srv/incidents/owner.sha256
    secrets: [gateway_postgres_password, gateway_retrieval_token]
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/deploy/policies/capabilities.json
        target: /srv/policy/capabilities.json
        read_only: true
        bind: { create_host_path: false }
      # The client registry (hashes, principals and scopes), replaced atomically by
      # scripts/m3/pi-client-token.sh; the directory is mounted so the gateway sees each new file.
      - type: bind
        source: /etc/firecrawl-pi/secrets/gateway
        target: /srv/clients
        read_only: true
        bind: { create_host_path: false }
      # Archived results (spec §21.2): the one writable path, on the data mount; the gateway refuses
      # to start unless it holds the marker scripts/m3/pi-init-m3.sh writes.
      - type: bind
        source: /srv/firecrawl-pi/data/artifacts
        target: /srv/artifacts
        bind: { create_host_path: false }
      # M8: the directory (a tmpfs systemd-tmpfiles creates at boot), so each atomic replacement of the file is seen.
      - type: bind
        source: /run/firecrawl-pi/admission
        target: /srv/admission
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /var/lib/firecrawl-pi/incidents/control/grants
        target: /srv/incidents/grants
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /var/lib/firecrawl-pi/incidents/control/requests
        target: /srv/incidents/requests
        bind: { create_host_path: false }
      - type: bind
        source: /var/lib/firecrawl-pi/incidents/control/reports
        target: /srv/incidents/reports
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /var/lib/firecrawl-pi/incidents/control/public-key.pem
        target: /srv/incidents/public-key.pem
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /var/lib/firecrawl-pi/incidents/control/owner.sha256
        target: /srv/incidents/owner.sha256
        read_only: true
        bind: { create_host_path: false }
    ports:
      - "127.0.0.1:3380:3300"
    # Docker's resolver still answers the project's own names. Other names go to this
    # upstream from the container's namespace, where fcpi_guard drops them at the bridge;
    # the host's loopback resolver, used by default, is reached from the host's namespace,
    # past the guard (evidence/M1/closeout/CLOSEOUT.md). 192.0.2.1 is TEST-NET-1 (RFC 5737).
    dns: [192.0.2.1]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3300,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      firecrawl-core: { condition: service_started }
      nuq-postgres: { condition: service_healthy }
    # Not on fcpi_core: the one host-published container reaches the core's API (fcpi_api) and
    # PostgreSQL alone (fcpi_platform), as its own DML-only role; no Redis, RabbitMQ, retrieval
    # service or Prometheus. M4: fcpi_mcp at a fixed address, where the MCP service calls its REST
    # routes and it proxies /mcp to the MCP service. M5: fcpi_model, where it reaches the retrieval service's
    # extraction listener, and nothing else of that service.
    networks:
      access: {}
      api: {}
      platform: {}
      mcp: { ipv4_address: 10.231.8.10 }
      model: { ipv4_address: 10.231.9.10 }
    logging: *logging-app

  # M4: the MCP service (services/mcp, spec §17): the official SDK's stateless request factory. It is
  # on fcpi_mcp alone, internal and isolated, so the gateway is the only thing it can reach and the
  # only thing that can reach it. Fixed addresses both ways: the gateway's resolver sends names it
  # does not own to a dropped upstream, so looking up a stopped service by name would hang where a
  # fixed address fails fast. No depends_on either way: REST never waits for MCP, and MCP starts
  # whether or not REST answers yet.
  mcp-gateway:
    image: fcpi/mcp-gateway@sha256:da485c8256b8f2e13ebebcf2013ae2e75cf580c577cc950e9b9bdc75a2d463b1
    platform: linux/arm64
    pull_policy: never
    hostname: mcp-gateway
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "3400:3400"
    environment:
      # A heap ceiling under the 192 MiB cap: at worst a predictable V8 failure rather than a cgroup OOM
      # kill (evidence/M4/raw/mcp-memory-probe.txt measures the envelope with it).
      NODE_OPTIONS: --max-old-space-size=96
      PI_MCP_LISTEN_PORT: "3400"
      PI_MCP_REST_URL: http://10.231.8.10:3300
      PI_CAPABILITIES_FILE: /srv/policy/capabilities.json
      PI_CLOUD_ACCESS_ENABLED: "false"
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/deploy/policies/capabilities.json
        target: /srv/policy/capabilities.json
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.3
    pids_limit: 64
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3400/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      mcp: { ipv4_address: 10.231.8.20 }
    logging: *logging-app

  # The controlled static target of the M1 fixture-only profile.
  fixture:
    image: node@sha256:a0ddbc73510e98f5e824fd64266ffe1c2c343ba9cf260d95ca2985ad632a3f3e
    platform: linux/arm64
    pull_policy: missing
    hostname: fixture
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "8080:8080"
    command: ["node", "/fixture/server.mjs"]
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/tests/fixtures/m1
        target: /fixture
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.1
    pids_limit: 32
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/static.html',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      fixture:
        aliases: [m1.fixture.fcpi.test]
    logging: *logging-dep

  # M2: the only acquisition path (spec §8.3). Its credential checks, SSRF rules, pacing, permits
  # and attempt budgets are in services/retrieval; it alone sits on fcpi_egress, whose DNS upstream
  # is that bridge's host address (the host's resolver), so no lookup leaves through the host's own
  # namespace past the guard (evidence/M1/closeout/CLOSEOUT.md).
  retrieval-service:
    image: fcpi/retrieval@sha256:9a68963492add6d6291aa577b6b020560dbe444c6424dca7fef3bf45fec9af12
    platform: linux/arm64
    pull_policy: never
    hostname: retrieval-service
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "3310:3310"
    # The owner's paid-dispatch switch (spec §28.3): PI_PAID_DISPATCH_ENABLED=true in this host file turns paid dispatch on
    # (fcpi paid on|off). Without the file every start, a reboot or a restore included, runs with paid dispatch off; restore
    # and rollback move it aside until provider spend newer than the backup is reconciled.
    env_file:
      - path: /etc/firecrawl-pi/paid-dispatch.env
        required: false
    environment:
      PI_RETRIEVAL_LISTEN: 10.231.5.10:3310
      PI_RETRIEVAL_PROXY_LISTEN: 10.231.2.10:3312
      PI_EGRESS_POLICY_FILE: /srv/policy/egress.json
      PI_EGRESS_LOCAL_CIDRS_FILE: /srv/local/egress-local.cidrs
      PI_RESOLVER: 10.231.6.1
      PI_BROWSER_URL: http://10.231.2.20:3320
      PI_CREDENTIALS_DIR: /run/secrets
      PI_POSTGRES_HOST: nuq-postgres
      PI_POSTGRES_DB: postgres
      PI_POSTGRES_USER: fcpi_retrieval
      PI_MAX_URL_ACQUISITIONS: "2"
      PI_MAX_BROWSER_PAGES: "1"
      PI_CLOUD_ACCESS_ENABLED: "false"
      # M7: screenshots and the safe action subset (a switch, so the optional capability can be turned off alone), and
      # webhook delivery for the gateway's outbox ("suppressed" holds every event unsent, as a restore does).
      PI_BROWSER_EXTRAS_ENABLED: "true"
      PI_WEBHOOK_DELIVERY: "enabled"
      # M5: SearXNG on fcpi_search, the search proxy SearXNG's engines leave through, the gateway's
      # extraction listener on fcpi_model, the budget policy, the provider credentials (a directory, so a key
      # placed there later needs no recreation; an absent key is BLOCKED_CREDENTIAL or PARSER_REQUIRED) and
      # the host's selection of engines, model and parser.
      PI_SEARCH_URL: http://10.231.10.20:8080/search
      PI_SEARCH_PROXY_LISTEN: 10.231.10.10:3313
      PI_EXTRACT_LISTEN: 10.231.9.20:3314
      PI_BUDGET_POLICY_FILE: /srv/policy/budget.json
      PI_PROVIDERS_DIR: /run/providers
      PI_SELECTION_FILE: /srv/selection/selection.json
      # M8: the host's admission state; the browser tier waits while browser work is paused (spec §23.1).
      PI_ADMISSION_FILE: /srv/admission/admission.json
    secrets: [retrieval_postgres_password, retrieval_core_token_sha256, retrieval_browser_token, retrieval_gateway_token_sha256, retrieval_searxng_proxy_sha256, webhook_signing_secret]
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/deploy/policies/egress.json
        target: /srv/policy/egress.json
        read_only: true
        bind: { create_host_path: false }
      # The directory, so the service's reload sees each atomic replacement of the file (a new inode).
      - type: bind
        source: /etc/firecrawl-pi/egress-local
        target: /srv/local
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /opt/firecrawl-pi/deploy/policies/budget.json
        target: /srv/policy/budget.json
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /etc/firecrawl-pi/secrets/providers
        target: /run/providers
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /etc/firecrawl-pi/selection
        target: /srv/selection
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: /run/firecrawl-pi/admission
        target: /srv/admission
        read_only: true
        bind: { create_host_path: false }
    dns: [10.231.6.1]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 448m
    memswap_limit: 448m
    cpus: 0.6
    pids_limit: 128
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://10.231.5.10:3310/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      nuq-postgres: { condition: service_healthy }
    networks:
      acquire: { ipv4_address: 10.231.5.10 }
      browser: { ipv4_address: 10.231.2.10 }
      core: {}
      fixture: {}
      egress: {}
      search: { ipv4_address: 10.231.10.10 }
      model: { ipv4_address: 10.231.9.20 }
    logging: *logging-app

  # M5: private SearXNG (spec §13), JSON only, one worker, no limiter. Its only network is fcpi_search, whose
  # other member is the retrieval service: every engine request leaves through that service's search proxy
  # (deploy/searxng/settings.yml), which the host's selection limits to the fixture engine or the live
  # engines' hosts. Non-root, read-only root, settings rendered to a tmpfs by deploy/searxng/entrypoint.sh.
  searxng:
    image: searxng/searxng@sha256:d9ca82c19f98a684db92af79f5647028e39aaaa90d10611633260139f65b0c19
    platform: linux/arm64
    pull_policy: missing
    hostname: searxng
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "3330:3330"
    entrypoint: ["/fcpi/entrypoint.sh"]
    environment:
      GRANIAN_WORKERS: "1"
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: "8080"
    secrets:
      - { source: searxng_secret_key, target: searxng_secret_key }
      - { source: searxng_proxy_password, target: searxng_proxy_password }
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/deploy/searxng
        target: /fcpi
        read_only: true
        bind: { create_host_path: false }
    tmpfs:
      - /etc/searxng:uid=3330,gid=3330,mode=0700,size=1m
      - /var/cache/searxng:uid=3330,gid=3330,mode=0700,size=32m
      - /tmp:size=16m
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.4
    pids_limit: 64
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      search: { ipv4_address: 10.231.10.20 }
    logging: *logging-dep

  # M2: bounded Chromium (spec §12), non-root with the sandbox on under the project seccomp profile
  # (Docker's default plus chroot, clone and unshare; scripts/m2/build-seccomp.mjs). Its network is
  # internal and holds only itself and the retrieval service, whose proxy is its one way out.
  browser-worker:
    image: fcpi/browser@sha256:4d729d6ad77e455ef012744cd9a880a10e74da36f9cb90d94b03fc9e911313c3
    platform: linux/arm64
    pull_policy: never
    hostname: browser-worker
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "3320:3320"
    init: true
    environment:
      PI_BROWSER_LISTEN: 10.231.2.20:3320
      PI_CREDENTIALS_DIR: /run/secrets
      PI_BROWSER_EXTRAS_ENABLED: "true"
      HOME: /tmp
    secrets: [browser_token_sha256]
    tmpfs:
      - /tmp:size=256m,mode=1777
    shm_size: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=/opt/firecrawl-pi/deploy/browser/seccomp.json
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://10.231.2.20:3320/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      browser: { ipv4_address: 10.231.2.20 }
    logging: *logging-app

  # M2's controlled targets (tests/fixtures/m2/server.mjs), on the internal fixture network under
  # the names the retrieval service's policy lists. Its larger cap holds the size-limit fixtures.
  fixture-m2:
    image: node@sha256:a0ddbc73510e98f5e824fd64266ffe1c2c343ba9cf260d95ca2985ad632a3f3e
    platform: linux/arm64
    pull_policy: missing
    hostname: fixture-m2
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "8080:8080"
    command: ["node", "/fixtures/m2/server.mjs"]
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/tests/fixtures
        target: /fixtures
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.2
    pids_limit: 32
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/short.html',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      fixture:
        # m2: the main fixture name; pace: the default direct limits (spec §10.2); cool: 429 cooldowns,
        # which persist per domain and would otherwise hold back every later test on m2.
        # permit, permit2: two more fixture domains, so the global URL permits bind before per-domain
        # pacing does, on domains no cooldown case touches.
        aliases: [m2.fixture.fcpi.test, pace.fixture.fcpi.test, cool.fixture.fcpi.test, permit.fixture.fcpi.test, permit2.fixture.fcpi.test]
    logging: *logging-dep

  # M3's controlled site graph (tests/fixtures/m3/server.mjs): crawls, batches, maps, cancellation and
  # held synchronous requests, under the one fixture name the retrieval service's policy adds for it.
  fixture-m3:
    image: node@sha256:a0ddbc73510e98f5e824fd64266ffe1c2c343ba9cf260d95ca2985ad632a3f3e
    platform: linux/arm64
    pull_policy: missing
    hostname: fixture-m3
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "8080:8080"
    command: ["node", "/fixture/server.mjs"]
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/tests/fixtures/m3
        target: /fixture
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.1
    pids_limit: 32
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/robots.txt',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      fixture:
        aliases: [m3.fixture.fcpi.test]
    logging: *logging-dep

  # M5's controlled documents and fixture providers (tests/fixtures/m5/server.mjs): every document class of
  # spec §15, the OpenAI-compatible model, the LlamaParse-compatible parser and the engine behind
  # SearXNG's "fcpi fixture", under the fixture names the retrieval service's policy lists.
  fixture-m5:
    image: node@sha256:a0ddbc73510e98f5e824fd64266ffe1c2c343ba9cf260d95ca2985ad632a3f3e
    platform: linux/arm64
    pull_policy: missing
    hostname: fixture-m5
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "8080:8080"
    command: ["node", "/fixtures/m5/server.mjs"]
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/tests/fixtures
        target: /fixtures
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.2
    pids_limit: 32
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      fixture:
        aliases: [m5.fixture.fcpi.test, model.fixture.fcpi.test, parser.fixture.fcpi.test, search.fixture.fcpi.test]
    logging: *logging-dep

  # M6's controlled residential proxy and targets (tests/fixtures/m6/server.mjs): a proxy on :8081 that speaks
  # Decodo's documented contract (CONNECT, the session username, a sticky exit per session, a usage report), and
  # targets on :8080 that answer a request that came through it differently from one that came directly. Its
  # control port is bound to the container's loopback, reached only with docker exec. The proxy's credential is
  # checked by its SHA-256; the retrieval service holds the credential itself in its provider directory.
  fixture-m6:
    image: node@sha256:a0ddbc73510e98f5e824fd64266ffe1c2c343ba9cf260d95ca2985ad632a3f3e
    platform: linux/arm64
    pull_policy: missing
    hostname: fixture-m6
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "8080:8080"
    command: ["node", "/fixtures/m6/server.mjs"]
    secrets: [fixture_proxy_sha256]
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/tests/fixtures
        target: /fixtures
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.2
    pids_limit: 32
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      fixture:
        aliases: [m6.fixture.fcpi.test, m6pace.fixture.fcpi.test, m6hard.fixture.fcpi.test, m6learn.fixture.fcpi.test, m6bulk.fixture.fcpi.test,
          m6cool.fixture.fcpi.test, m6esc.fixture.fcpi.test, searchr.fixture.fcpi.test, proxy.fixture.fcpi.test]
    logging: *logging-dep

  # M7's controlled enhanced provider, targets and webhook receiver (tests/fixtures/m7/server.mjs): a provider on :8080
  # that speaks Zyte API's documented contract (Basic authentication, /v1/extract, a target's status in a 200, 520 for a
  # ban) and fetches targets itself on this network; targets that answer it, the M6 fixture proxy and a direct request
  # differently; screenshot, action and change pages; and a receiver that checks each delivery's signature, timestamp
  # and event id as a receiver should. Control on the container's loopback, reached only with docker exec.
  fixture-m7:
    image: node@sha256:a0ddbc73510e98f5e824fd64266ffe1c2c343ba9cf260d95ca2985ad632a3f3e
    platform: linux/arm64
    pull_policy: missing
    hostname: fixture-m7
    restart: unless-stopped
    cgroup_parent: fcpi.slice          # M8: swap denied by the slice (deploy/host/fcpi.slice), which a reload re-asserts
    user: "8080:8080"
    command: ["node", "/fixtures/m7/server.mjs"]
    secrets: [fixture_zyte_sha256, fixture_webhook_secret]
    volumes:
      - type: bind
        source: /opt/firecrawl-pi/tests/fixtures
        target: /fixtures
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.2
    pids_limit: 32
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8082/healthz',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      fixture-m6: { condition: service_healthy }
    networks:
      fixture:
        aliases: [m7.fixture.fcpi.test, m7esc.fixture.fcpi.test, m7shot.fixture.fcpi.test, m7chg.fixture.fcpi.test, m7cache.fixture.fcpi.test,
          zyte.fixture.fcpi.test, hooks.fixture.fcpi.test]
    logging: *logging-dep

networks:
  # Not internal: port publishing needs a non-internal bridge. Only the gateway joins it.
  access:
    name: fcpi_access
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-access
    ipam:
      config: [{ subnet: 10.231.0.0/24 }]
  # Internal and isolated: no route out, and no host address on the bridge, so members
  # cannot reach the Internet or the host's own listeners (Pi-hole, Mosquitto, airdb, sshd).
  core:
    name: fcpi_core
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-core
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 10.231.1.0/24 }]
  fixture:
    name: fcpi_fixture
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-fixture
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 10.231.3.0/24 }]
  # The gateway-to-core link, internal and isolated like core and fixture.
  api:
    name: fcpi_api
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-api
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 10.231.4.0/24 }]
  # M2: the core-to-retrieval-service link, internal and isolated.
  acquire:
    name: fcpi_acquire
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-acquire
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 10.231.5.0/24 }]
  # M2: the browser worker and the retrieval service's proxy, internal and isolated: Chromium has
  # no route anywhere else, so WebRTC, direct UDP or a service worker cannot bypass the proxy.
  browser:
    name: fcpi_browser
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-browser
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 10.231.2.0/24 }]
  # M3: the gateway's path to PostgreSQL (the platform ledger), internal and isolated; nothing else joins.
  platform:
    name: fcpi_platform
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-platform
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 10.231.7.0/24 }]
  # M4: the gateway and the MCP service, internal and isolated; nothing else joins.
  mcp:
    name: fcpi_mcp
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-mcp
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 10.231.8.0/24 }]
  # M5: the retrieval service's search proxy and SearXNG, internal and isolated: SearXNG has no other route.
  search:
    name: fcpi_search
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-search
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 10.231.10.0/24 }]
  # M5: the gateway and the retrieval service's extraction listener, internal and isolated; nothing else joins.
  model:
    name: fcpi_model
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-model
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    ipam:
      config: [{ subnet: 10.231.9.0/24 }]
  # M2: the retrieval service's way out, and the only non-internal network besides the gateway's.
  # fcpi_guard admits new TCP connections to public addresses on 80 and 443 and DNS to the host
  # address 10.231.6.1; the rest is dropped and counted (deploy/host/fcpi-guard.nft).
  egress:
    name: fcpi_egress
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: fcpi-egress
    ipam:
      config: [{ subnet: 10.231.6.0/24, gateway: 10.231.6.1 }]

# Files under /etc/firecrawl-pi/secrets (directory 0700, files 0600), created by
# scripts/m1/pi-init.sh; names, owners and modes are listed in deploy/secrets.template.
secrets:
  postgres_password: { file: /etc/firecrawl-pi/secrets/postgres_password }
  core_postgres_password: { file: /etc/firecrawl-pi/secrets/core_postgres_password }
  postgres_core_role_password: { file: /etc/firecrawl-pi/secrets/postgres_core_role_password }
  rabbitmq_default_user_conf: { file: /etc/firecrawl-pi/secrets/rabbitmq_default_user_conf }
  redis_users_acl: { file: /etc/firecrawl-pi/secrets/redis_users_acl }
  core_redis_url: { file: /etc/firecrawl-pi/secrets/core_redis_url }
  core_nuq_rabbitmq_url: { file: /etc/firecrawl-pi/secrets/core_nuq_rabbitmq_url }
  # M2 (scripts/m2/pi-init-m2.sh)
  postgres_retrieval_role_password: { file: /etc/firecrawl-pi/secrets/postgres_retrieval_role_password }
  retrieval_postgres_password: { file: /etc/firecrawl-pi/secrets/retrieval_postgres_password }
  core_retrieval_token: { file: /etc/firecrawl-pi/secrets/core_retrieval_token }
  retrieval_core_token_sha256: { file: /etc/firecrawl-pi/secrets/retrieval_core_token_sha256 }
  retrieval_browser_token: { file: /etc/firecrawl-pi/secrets/retrieval_browser_token }
  browser_token_sha256: { file: /etc/firecrawl-pi/secrets/browser_token_sha256 }
  # M3 (scripts/m3/pi-init-m3.sh)
  gateway_postgres_password: { file: /etc/firecrawl-pi/secrets/gateway_postgres_password }
  postgres_gateway_role_password: { file: /etc/firecrawl-pi/secrets/postgres_gateway_role_password }
  # M5 (scripts/m5/pi-init-m5.sh)
  gateway_retrieval_token: { file: /etc/firecrawl-pi/secrets/gateway_retrieval_token }
  retrieval_gateway_token_sha256: { file: /etc/firecrawl-pi/secrets/retrieval_gateway_token_sha256 }
  retrieval_searxng_proxy_sha256: { file: /etc/firecrawl-pi/secrets/retrieval_searxng_proxy_sha256 }
  searxng_proxy_password: { file: /etc/firecrawl-pi/secrets/searxng_proxy_password }
  searxng_secret_key: { file: /etc/firecrawl-pi/secrets/searxng_secret_key }
  # M6: the fixture proxy's credential, as its SHA-256 (the credential itself is in the providers directory).
  fixture_proxy_sha256: { file: /etc/firecrawl-pi/secrets/fixture_proxy_sha256 }
  # M7 (scripts/m7/pi-init-m7.sh): the webhook signing secret (the retrieval service signs with it; the fixture receiver
  # holds its own copy of the one value, as a receiver must), and the fixture enhanced provider's key as its SHA-256.
  webhook_signing_secret: { file: /etc/firecrawl-pi/secrets/webhook_signing_secret }
  fixture_webhook_secret: { file: /etc/firecrawl-pi/secrets/fixture_webhook_secret }
  fixture_zyte_sha256: { file: /etc/firecrawl-pi/secrets/fixture_zyte_sha256 }
