# Installed by scripts/m8/pi-init-m8.sh as /etc/systemd/system/docker.service.d/40-fcpi-docker-log-repair.conf.
# Before dockerd opens any container's log, rewrites each json-file log a power cut left NUL blocks in, so `docker logs`
# reads past the damage again (/etc/firecrawl-pi/fcpi-docker-log-repair.sh). A failure here does not keep dockerd
# down ("-"). The script lives under /etc/firecrawl-pi, outside the deploy tree, so a deploy of an older commit cannot
# remove what this drop-in runs.
[Service]
ExecStartPre=-/etc/firecrawl-pi/fcpi-docker-log-repair.sh
