# Installed by scripts/m1/pi-init.sh as /etc/systemd/system/docker.service.d/10-fcpi-data-check.conf.
# The Docker Engine on this host exists only for the fcpi project (M0 found no container
# runtime). Its restart policies (restart: unless-stopped) revive every container that was
# running when the host lost power, at dockerd start and before fcpi-stack.service runs, so
# the fail-closed data check must gate dockerd itself. A failing check leaves dockerd down
# (after Restart=always spends its StartLimitBurst): no writer can open a data path that is
# on the wrong filesystem, lacks the data ID, or has a bind that could be created.
# ExecStartPre rather than Requires=fcpi-data-check.service: Requires would also carry an
# explicit stop or restart of the check unit through to dockerd and every container.
# The check renders Compose without a daemon (docker compose config needs only the CLI).
[Service]
ExecStartPre=/opt/firecrawl-pi/deploy/host/fcpi-data-check.sh
