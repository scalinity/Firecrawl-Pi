# Installed by scripts/m1/pi-init.sh as /etc/systemd/system/docker.service.d/20-fcpi-guard.conf.
# Loads the access-bridge guard before every dockerd start, after 10-fcpi-data-check.conf's
# check: restart policies revive containers at dockerd start, so the guard has to exist
# before dockerd does. A failed load keeps dockerd down. pi-init.sh installs the ruleset
# (deploy/host/fcpi-guard.nft) under /etc/firecrawl-pi, outside the deploy tree, so a
# deploy of an older commit cannot remove it.
[Service]
ExecStartPre=/usr/sbin/nft -f /etc/firecrawl-pi/fcpi-guard.nft
