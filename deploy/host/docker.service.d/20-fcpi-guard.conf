# Installed by scripts/m1/pi-init.sh as /etc/systemd/system/docker.service.d/20-fcpi-guard.conf.
# Loads the access-bridge guard (deploy/host/fcpi-guard.nft) before every dockerd start,
# after 10-fcpi-data-check.conf's check: restart policies revive containers at dockerd
# start, so the guard has to exist before dockerd does. A failed load keeps dockerd down.
[Service]
ExecStartPre=/usr/sbin/nft -f /opt/firecrawl-pi/deploy/host/fcpi-guard.nft
