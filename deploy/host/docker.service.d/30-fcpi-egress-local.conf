# Installed by scripts/m2/pi-init-m2.sh as /etc/systemd/system/docker.service.d/30-fcpi-egress-local.conf.
# After 20-fcpi-guard.conf loads the guard, fills its egress_local_v4 set with the host's connected
# networks and refreshes /etc/firecrawl-pi/egress-local.cidrs, before dockerd's restart policies
# revive the retrieval service. A failure here does not keep dockerd down ("-"): the retrieval
# service refuses every acquisition while its copy of the list names no network, and the guard
# still drops every non-public range. The script lives under /etc/firecrawl-pi, outside the deploy
# tree, so a deploy of an older commit cannot remove what this drop-in runs.
[Service]
ExecStartPre=-/etc/firecrawl-pi/fcpi-egress-local.sh
