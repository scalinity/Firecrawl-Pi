# Installed by scripts/m8/pi-init-m8.sh as /etc/tmpfiles.d/fcpi.conf. systemd-tmpfiles-setup creates these at every
# boot, before dockerd: the admission directory is a bind source of the gateway and the retrieval service, and the data
# check refuses a start while a bind source is absent. The file inside starts as "open" and is rewritten by the tick.
d /run/firecrawl-pi 0755 root root -
d /run/firecrawl-pi/admission 0755 root root -
d /run/firecrawl-pi/holds 0755 root root -
f /run/firecrawl-pi/admission/admission.json 0644 root root - {"utc":"1970-01-01T00:00:00Z","dispatch":"open","browser":"open","reasons":["boot"]}
