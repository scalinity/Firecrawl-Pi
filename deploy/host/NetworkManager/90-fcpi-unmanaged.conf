# Installed by scripts/m1/pi-init.sh as /etc/NetworkManager/conf.d/90-fcpi-unmanaged.conf.
# Docker creates and removes these interfaces; NetworkManager has nothing to configure on
# them. Without this file it offers its idle wired profile to every new veth and starts a
# DHCP transaction there (evidence/M1/review/REVIEW.md, R14). wlan0, the Pi's only uplink,
# is not matched.
[keyfile]
unmanaged-devices=interface-name:veth*;interface-name:fcpi-*;interface-name:docker0
