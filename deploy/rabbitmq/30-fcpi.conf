# FCPI RabbitMQ (M1), layered on the image's conf.d defaults.
# Spec §22: memory alarm at 256 MiB, below the 512 MiB container cap.
vm_memory_high_watermark.absolute = 256MiB
# The first-boot user (40-fcpi-default-user.conf) gets no tags: the core needs only its
# AMQP permissions, and the administrator tag would matter only to the management API.
default_user_tags.administrator = false
