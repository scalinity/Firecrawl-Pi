# FCPI Redis (M1). Mounted read-only; redis-server runs directly as uid 999, so the
# image entrypoint's permission fixing and bundled-module loading are not used
# (upstream issues no module command).
bind 0.0.0.0
port 6379
protected-mode yes
# Users and password hashes only; the plaintext lives in the core's REDIS_URL secret.
aclfile /run/secrets/redis_users_acl
dir /data
# Spec §21.2: AOF with one-second fsync; no RDB snapshots, to limit card writes.
appendonly yes
appendfsync everysec
appenddirname appendonlydir
save ""
# Spec §21.2: 192 MiB inside the 320 MiB container cap; required state is never evicted.
maxmemory 192mb
maxmemory-policy noeviction
